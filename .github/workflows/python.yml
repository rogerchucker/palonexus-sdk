name: Python SDK

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.20"
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Sync locked SDK dependencies
        run: uv sync --frozen --all-extras
      - name: Verify Python SDK
        run: |
          uv run --frozen --no-sync pytest python/tests -q
          uv run --frozen --no-sync ruff check python scripts
          uv run --frozen --no-sync mypy python/src
          uv run --frozen --no-sync python scripts/verify_legal.py
      - name: Verify clean-room distributions
        run: uv run --frozen --no-sync python scripts/verify_python_artifacts.py
