name: Python SDK

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.20"
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Sync locked SDK dependencies
        run: uv sync --frozen --all-extras
      - name: Verify Python SDK
        run: |
          uv run --frozen --no-sync pytest python/tests -q
          uv run --frozen --no-sync ruff check python scripts
          uv run --frozen --no-sync mypy python/src
          uv run --frozen --no-sync python scripts/verify_legal.py
      - name: Verify clean-room distributions
        run: uv run --frozen --no-sync python scripts/verify_python_artifacts.py
