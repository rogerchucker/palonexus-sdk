[build-system]
requires = [
  "hatch-vcs==0.5.0",
  "hatchling==1.31.0",
  "packaging==26.2",
  "pathspec==1.1.1",
  "pluggy==1.6.0",
  "setuptools==83.0.0",
  "setuptools-scm==10.2.1",
  "trove-classifiers==2026.6.1.19",
  "vcs-versioning==2.2.2",
]
build-backend = "hatchling.build"

[project]
name = "palonexus"
dynamic = ["version"]
description = "Python SDK for the PaloNexus agent control plane"
readme = { text = """
# PaloNexus Python SDK

Typed, fail-closed authorization models and clients for the PaloNexus agent
control plane. Documentation and examples are maintained in the public
[PaloNexus SDK repository](https://github.com/rogerchucker/palonexus-sdk).
""", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "PaloNexus maintainers" },
]
keywords = ["platform-contract-sha:8d2547c7aaa66bb5d418b39b894ddc207026b1af"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "cryptography>=46.0.5,<47",
  "httpx>=0.28.1,<0.29",
  "idna==3.18",
  "keyring>=25.7.0,<26",
  "packaging>=26,<27",
  "pydantic>=2.13.4,<3",
  "pyyaml==6.0.3",
  "rfc8785>=0.1.4,<0.2",
  "unicodedata2==15.1.0",
]

[project.scripts]
pnxs = "palonexus.cli.main:entrypoint"

[project.urls]
Homepage = "https://github.com/rogerchucker/palonexus-sdk"
Repository = "https://github.com/rogerchucker/palonexus-sdk"
Documentation = "https://github.com/rogerchucker/palonexus-sdk#readme"
Issues = "https://github.com/rogerchucker/palonexus-sdk/issues"
Changelog = "https://github.com/rogerchucker/palonexus-sdk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
langchain = [
    "langchain>=1,<2",
    "langchain-core>=1,<2",
    "langgraph>=1,<2",
]
langgraph = [
    "langchain-core>=1,<2",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
]
deepagents = [
    "deepagents>=0.3,<1",
    "langchain>=1,<2",
    "langchain-core>=1,<2",
    "langgraph>=1,<2",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
search_parent_directories = true

[tool.hatch.build.hooks.vcs]
version-file = "src/palonexus/_version.py"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/palonexus"]

[tool.hatch.build.targets.sdist]
include = [
  "LICENSE",
  "hatch_build.py",
  "pyproject.toml",
  "src/palonexus",
]

[tool.palonexus.platform-contract]
repository = "rogerchucker/palonexus-platform"
# Task 1 adds canonical developer schemas to both repositories and lists their
# repository-relative paths here. The release gate rejects missing, extra, or
# byte-different files as soon as this list is populated.
schema-paths = ["contracts/developer/cli-compatibility-v1.schema.json", "contracts/developer/exact-action-v3.schema.json", "contracts/developer/registration-profile-v1.schema.json", "contracts/developer/v1.schema.json"]
