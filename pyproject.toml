[tool.uv.workspace]
members = ["python"]

[dependency-groups]
dev = [
  "hatch-vcs>=0.5.0",
  "hatchling>=1.31.0",
  "idna==3.18",
  "jsonschema>=4.26.0",
  "mypy==2.3.0",
  "pytest>=9.1.1",
  "pyyaml==6.0.3",
  "ruff>=0.16.0",
  "unicodedata2==15.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["foundation_tests", "protocol/tests", "python/tests"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# Generated DTOs are checked by deterministic generation and protocol suites.
# Handwritten SDK modules remain under strict mypy.
module = "palonexus._generated.*"
ignore_errors = true

[[tool.mypy.overrides]]
# This is the byte-identical, vector-audited protocol reference implementation.
# Its cross-version exact-decimal and pinned-Unicode paths are checked by the
# protocol suites on every supported Python version.
module = "palonexus._canonicalize"
ignore_errors = true

[tool.palonexus.protocol-generation]
generator-version = "2"
schemas = [
  "protocol/schemas/common-v1.schema.json",
  "protocol/schemas/action-v1.schema.json",
  "protocol/schemas/decision-v1.schema.json",
  "protocol/schemas/approval-v1.schema.json",
  "protocol/schemas/error-v1.schema.json",
  "protocol/schemas/reconciliation-v1.schema.json",
]
outputs = [
  "python/src/palonexus/_generated/protocol.py",
  "guard/pkg/protocol/generated.go",
]
