[tool.uv.workspace]
members = ["python"]

[dependency-groups]
dev = [
  "hatch-vcs>=0.4",
  "hatchling>=1.27",
  "idna==3.18",
  "jsonschema>=4.25",
  "pytest>=8.4",
  "pyyaml==6.0.3",
  "ruff>=0.12",
  "unicodedata2==15.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["foundation_tests", "protocol/tests", "python/tests"]

[tool.palonexus.protocol-generation]
generator-version = "2"
schemas = [
  "protocol/schemas/common-v1.schema.json",
  "protocol/schemas/action-v1.schema.json",
  "protocol/schemas/decision-v1.schema.json",
  "protocol/schemas/approval-v1.schema.json",
  "protocol/schemas/error-v1.schema.json",
  "protocol/schemas/reconciliation-v1.schema.json",
]
outputs = [
  "python/src/palonexus/_generated/protocol.py",
  "guard/pkg/protocol/generated.go",
]
